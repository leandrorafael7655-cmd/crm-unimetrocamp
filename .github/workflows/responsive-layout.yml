name: Responsive layout
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: responsive-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Type check
        run: |
          pnpm exec next typegen
          pnpm exec tsc --noEmit
      - name: Lint
        run: pnpm lint
      - name: Production build
        run: pnpm build
      - name: Existing and audit regression tests
        run: pnpm test
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Validate screens in Chromium and WebKit
        env:
          RESPONSIVE_TOOLS: ${{ github.workspace }}
        run: node tests/responsive/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-results
          path: responsive-results
