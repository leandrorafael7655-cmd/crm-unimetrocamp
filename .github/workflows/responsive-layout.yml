name: Responsive layout
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: responsive-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply existing build patches
        run: |
          node scripts/apply-route-name-feature.mjs
          node scripts/apply-attendance-feature.mjs
          node scripts/apply-attendance-member-safety.mjs
          node scripts/apply-operational-name-feature.mjs
          node scripts/apply-user-edit-feature.mjs
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Existing tests
        run: pnpm test
      - name: Install browser validation tools
        run: |
          npm install --prefix /tmp/uniconecta-responsive-tools --no-package-lock --no-save esbuild@0.25.9 playwright@1.55.0
          /tmp/uniconecta-responsive-tools/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Validate screens in Chromium and WebKit
        run: node tests/responsive/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: responsive-results
          path: responsive-results
